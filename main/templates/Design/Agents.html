{% extends "base.html" %}

{% block title %}
    <title>Rover Triple Rover Mode</title>
{% endblock %}

{% block extra_js %}
    <script src="{{ url_for('static', filename='scripts/Design/Agents.js') }}?v=1" defer></script>
{% endblock %}

{% block content %}
<style>
    #agentsPage,
    #agentsPage * {
        box-sizing: border-box;
        font-family: "Roboto Mono", monospace;
    }

    #agentsPage {
        height: 100dvh;
        display: flex;
        flex-direction: column;
    }

    #agentsPage .agents-nav {
        flex: 0 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.5rem 1rem;
    }

    #agentsPage .agents-nav-group {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    #agentsPage .agents-nav-group:first-child {
        margin-left: 0;
    }

    #agentsPage .agents-nav-group:last-child {
        gap: 0.45rem;
        margin-right: 0;
    }

    #agentsPage .agents-nav-group:last-child label {
        margin: 0;
        color: #111;
        font: 0.65rem "Roboto Mono", monospace;
    }

    #agentsPage .agents-nav-link,
    #agentsPage .agents-nav-link:visited,
    #agentsPage .agents-nav-link:hover,
    #agentsPage .agents-nav-link:focus,
    #agentsPage .agents-nav-link:active {
        display: inline-flex;
        align-items: center;
        min-height: 2rem;
        padding: 0.25rem 0.55rem;
        border: 1px solid #111;
        border-radius: 4px;
        background: transparent;
        color: #111;
        font: 0.72rem "Roboto Mono", monospace;
        text-decoration: none !important;
    }

    #agentsPage .agents-nav-link:hover,
    #agentsPage .agents-nav-link:focus-visible {
        background: #111;
        color: #fff;
    }

    #agentsPage .rover-mode-select {
        min-height: 2rem;
        padding: 0.2rem 0.45rem;
        border: 1px solid #111;
        border-radius: 4px;
        background: #fff;
        color: #111;
        font: 0.62rem "Roboto Mono", monospace;
    }

    #agentsPage .agents-grid {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.85rem;
        padding: 0.5rem 1rem 1rem;
    }

    .rover-agent-card {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border: 2px solid #111;
        background: rgba(255, 255, 255, 0.97);
        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.12);
    }

    .rover-agent-header {
        flex: 0 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        min-width: 0;
        gap: 0.6rem;
        padding: 0.8rem;
        border-bottom: 1px solid #ddd;
    }

    .rover-agent-header > div {
        min-width: 0;
    }

    .rover-agent-title {
        margin: 0;
        color: #111;
        font-size: 0.9rem;
        overflow-wrap: anywhere;
    }

    .rover-agent-model {
        margin: 0.25rem 0 0;
        color: #666;
        font-size: 0.68rem;
        overflow-wrap: anywhere;
    }

    .rover-agent-status {
        flex: 1 1 0;
        min-width: 0;
        color: #555;
        font-size: 0.65rem;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .rover-agent-status[data-state="busy"] {
        color: #946200;
    }

    .rover-agent-status[data-state="ready"] {
        color: #16803c;
    }

    .rover-agent-status[data-state="error"] {
        color: #b42318;
    }

    .rover-agent-settings {
        flex: 0 0 auto;
        max-height: 42%;
        overflow-y: auto;
        padding: 0.55rem 0.75rem;
        border-bottom: 1px solid #ddd;
        color: #222;
        font-size: 0.68rem;
    }

    .rover-agent-settings summary {
        color: #111;
        font-weight: 700;
        cursor: pointer;
    }

    .rover-agent-settings label {
        display: block;
        margin-top: 0.5rem;
        color: #222;
    }

    .rover-agent-settings input,
    .rover-agent-settings textarea {
        display: block;
        width: 100%;
        margin-top: 0.2rem;
        padding: 0.4rem 0.5rem;
        border: 1px solid #bbb;
        border-radius: 3px;
        background: #fff;
        color: #111;
        font: inherit;
    }

    .rover-agent-settings textarea {
        min-height: 3.5rem;
        resize: vertical;
    }

    .rover-agent-save,
    .rover-agent-send {
        min-height: 2.3rem;
        padding: 0.45rem 0.65rem;
        border: 1px solid #111;
        border-radius: 3px;
        background: #111;
        color: #fff;
        font: inherit;
        cursor: pointer;
    }

    .rover-agent-save {
        margin-top: 0.55rem;
    }

    .rover-agent-save:disabled,
    .rover-agent-send:disabled {
        opacity: 0.55;
        cursor: wait;
    }

    .rover-agent-settings-status {
        min-height: 1rem;
        margin: 0.35rem 0 0;
        color: #666;
        overflow-wrap: anywhere;
    }

    .rover-agent-messages {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        overflow-y: auto;
        padding: 0.75rem;
    }

    .rover-agent-message {
        max-width: 96%;
        margin: 0;
        padding: 0.55rem 0.65rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #fff;
        color: #222;
        font-size: 0.68rem;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .rover-agent-message[data-role="user"] {
        align-self: flex-end;
        border-color: #111;
        background: #111;
        color: #fff;
    }

    .rover-agent-empty {
        margin: auto;
        color: #777;
        font-size: 0.7rem;
        text-align: center;
    }

    .rover-agent-chat-form {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 0.45rem;
        padding: 0.65rem;
        border-top: 1px solid #ddd;
    }

    .rover-agent-input {
        width: 100%;
        min-height: 2.6rem;
        max-height: 7rem;
        resize: vertical;
        padding: 0.5rem;
        border: 1px solid #bbb;
        border-radius: 3px;
        background: #fff;
        color: #111;
        font: 0.68rem/1.45 "Roboto Mono", monospace;
    }

    .agents-page-status {
        grid-column: 1 / -1;
        align-self: center;
        color: #b42318;
        text-align: center;
        font-size: 0.85rem;
    }

    @media (max-width: 1050px) {
        #agentsPage .agents-grid {
            overflow-y: auto;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: minmax(390px, 1fr);
        }
    }

    @media (max-width: 650px) {
        #agentsPage .agents-nav {
            align-items: flex-start;
            flex-wrap: wrap;
            padding-right: 0.65rem;
            padding-left: 0.65rem;
        }

        #agentsPage .agents-grid {
            grid-template-columns: minmax(0, 1fr);
            grid-auto-rows: minmax(65dvh, 1fr);
            padding-right: 0.65rem;
            padding-left: 0.65rem;
        }
    }
</style>

<div
    id="agentsPage"
    data-agents-url="{{ url_for('Ollama.get_rover_agents') }}"
    data-csrf-token="{{ csrf_token() }}"
>
    <nav class="top-nav agents-nav p-4" aria-label="Main navigation">
        <div class="agents-nav-group">
            <a href="{{ url_for('home.Rover_Home_Page') }}" class="button is-black is-outlined is-size-7 agents-nav-link">Home</a>
            <a href="{{ url_for('auth.Notes_Page') }}" class="button is-black is-outlined is-size-7 agents-nav-link">Notes</a>
        </div>
        <div class="agents-nav-group">
            <label class="is-sr-only" for="roverModeSelect">Rover mode</label>
            <select
                class="rover-mode-select"
                id="roverModeSelect"
                data-single-url="{{ url_for('auth.DesignDash') }}"
                data-triple-url="{{ url_for('auth.AgentsDash') }}"
                aria-label="Rover mode"
            >
                <option value="single">Single Rover Mode</option>
                <option value="triple" selected>Triple Rover Mode</option>
            </select>
        </div>
    </nav>
    <section class="agents-grid" id="roverAgentsGrid" aria-label="Triple Rover agent chats">
        <p class="agents-page-status" id="agentsPageStatus" role="status" aria-live="polite">Loading agents...</p>
    </section>
</div>
{% endblock %}
