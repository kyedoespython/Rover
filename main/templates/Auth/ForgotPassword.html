{% extends "base.html" %}

{% block title %}
    <title>Forgot Password | Rover</title>
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bulma/bulma.min.css') }}">
{% endblock %}

{% block content %}
<div class="container is-flex is-justify-content-center is-align-items-center" style="min-height: 100vh; min-height: 100dvh; padding: 1rem;">
    <section class="box" style="width: 100%; max-width: 450px;">
        <h1 class="title is-3 has-text-centered">Forgot password?</h1>
        <p class="mb-5">Enter your account email. If it matches an account, we will send a password reset link.</p>
        <form method="post" action="{{ url_for('auth.Handle_Forgot_Password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field mb-5">
                <label class="label" for="resetEmail">Email</label>
                <div class="control">
                    <input class="input" type="email" id="resetEmail" name="email" maxlength="254" autocomplete="email" required>
                </div>
            </div>
            <div class="has-text-centered">
                <button class="button is-black" type="submit">Send reset link</button>
            </div>
        </form>
        <p class="has-text-centered mt-4"><a href="{{ url_for('auth.Login') }}">Back to login</a></p>
    </section>
</div>
{% endblock %}
