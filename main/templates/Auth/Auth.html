{% extends "base.html" %}

{% block title %}
    <title>Rover Account Verification</title>
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bulma/bulma.min.css') }}">
{% endblock %}

{% block content %}
<style>
    #authPage,
    #authPage * {
        font-family: 'Roboto Mono', monospace !important;
    }

    #authPage {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    #authPage .auth-content {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
    }

    #authPage .auth-card {
        width: 100%;
        max-width: 450px;
        padding: 2rem;
        background: white;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    #authPage .input {
        background-color: white;
        color: black;
        border-color: #dbdbdb;
        box-shadow: none;
    }

    #authPage .input:focus {
        border-color: black;
        box-shadow: 0 0 0 0.125em rgba(0, 0, 0, 0.1);
    }

    #authPage .auth-button {
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    #authPage .auth-button:hover {
        background-color: white;
        color: black;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 600px) {
        #authPage .auth-card {
            padding: 1.5rem;
        }
    }
</style>

<div id="authPage">
    <nav class="top-nav p-4" style="display: flex; justify-content: space-between; align-items: center;">
        <a href="{{ url_for('home.Rover_Home_Page') }}" class="button is-black is-outlined is-size-6">Home</a>
        <a href="{{ url_for('home.Contact') }}" class="button is-black is-outlined is-size-6">Contact Support</a>
    </nav>

    <div class="auth-content">
        <section class="box auth-card">
            <h1 class="title is-3 has-text-centered has-text-black mb-3">Verify your account</h1>
            <p class="has-text-centered has-text-grey mb-5">Enter the authentication code sent to your email.</p>

            <form action="{{ url_for('auth.Handle_Auth') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="field">
                    <label class="label has-text-black" for="authCode">Authentication code</label>
                    <div class="control">
                        <input class="input" type="text" name="authCode" id="authCode" placeholder="Enter your code" autocomplete="one-time-code" required>
                    </div>
                </div>

                <div class="has-text-centered mt-5">
                    <button class="button is-black auth-button" type="submit">Verify code</button>
                </div>
            </form>

            <form method="POST" action="{{ url_for('auth.ResendAuth') }}" class="has-text-centered mt-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="button is-black is-outlined is-size-6" type="submit">Resend auth code</button>
            </form>
        </section>
    </div>
</div>
{% endblock %}
