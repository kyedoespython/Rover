{% extends "base.html" %}

{% block title %}  <title>Rover Auth</title> {% endblock %}

<!-- Bulma CSS Style sheet -->
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='node_modules/bulma/css/bulma.min.css') }}">
{% endblock %}

<!-- JS link -->
{% block extra_js %}
    <script src="{{ url_for('static', filename='scripts/Auth/Auth.js') }}"></script>
{% endblock %}

{% block content %}

<!-- Get the authentication code from the user -->
<form action="{{ url_for('auth.Handle_Auth') }}" id="resendForm" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"> <!-- Form uses csrf form protection token -->

    <div class="auth_code">
        <input type="text" name="authCode" id="authCode" placeholder="Enter your authentication code" style="width: 300px; height: 50px;">
    </div>

    <form method="POST" action="{{ url_for('auth.ResendAuth') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"> <!-- Form uses csrf form protection token -->

        <button id="resendBtn" type="submit" onclick="resendCode()">Resend Auth Code</button>
        <span id="CountDownText"></span>
    </form>

</form>

{% endblock %}
