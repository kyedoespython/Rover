{% extends "base.html" %}

{% block title %}<title>Rover Notes</title>{% endblock %}
{% block extra_js %}
    <script type="module" src="{{ url_for('static', filename='react/app.js') }}"></script>
{% endblock %}
{% block content %}
<div id="react-root" data-page="notes" data-csrf-token="{{ csrf_token() }}">
    <script id="react-props" type="application/json">
    {
        "notes": [
            {% for note in notes %}
            {
                "id": {{ note.note_id|tojson }},
                "name": {{ note.note_name|tojson }},
                "description": {{ note.note_description|tojson }}
            }{% if not loop.last %},{% endif %}
            {% endfor %}
        ],
        "selectedNote": {% if selected_note %}{
            "id": {{ selected_note.note_id|tojson }},
            "name": {{ selected_note.note_name|tojson }},
            "description": {{ selected_note.note_description|tojson }}
        }{% else %}null{% endif %},
        "selectedContent": {{ selected_content|tojson }},
        "page": {{ pagination.page|tojson }},
        "pages": {{ pagination.pages|tojson }},
        "hasPrev": {{ pagination.has_prev|tojson }},
        "prevPage": {{ pagination.prev_num|tojson }},
        "hasNext": {{ pagination.has_next|tojson }},
        "nextPage": {{ pagination.next_num|tojson }}
    }
    </script>
</div>
{% endblock %}
