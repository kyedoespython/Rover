{% extends "base.html" %}

{% block title %}
    <title>Rover Login</title>
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bulma/bulma.min.css') }}">
{% endblock %}

{% block content %}

<style>
    .bg-image {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background-image: url("{{ url_for('static', filename='images/WorldImage.jpg') }}");
        background-color: var(--rover-background);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 0;
    }
    .bg-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background-color: rgba(11, 16, 9, 0.72);
        z-index: 1;
        pointer-events: none;
    }

    .font-roboto, .font-roboto * {
        font-family: 'Roboto Mono', monospace !important;
    }

    .font-roboto {
        position: relative;
        z-index: 2;
    }

    .input {
        background-color: var(--rover-control-bg) !important;
        color: var(--rover-text) !important;
        border: 1px solid var(--rover-control-border) !important;
        box-shadow: none !important;
    }
    .input::placeholder {
        color: var(--rover-muted) !important;
        opacity: 1;
    }
    .input:focus {
        border-color: var(--rover-accent) !important;
        box-shadow: 0 0 0 0.125em rgba(140, 163, 78, 0.2) !important;
    }

    .hover_designNow {
        transition: all 0.5s ease;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
    }
    .hover_designNow:hover {
        background-color: var(--rover-accent-strong-hover) !important;
        color: var(--rover-text) !important;
    }
</style>

<div class="bg-image"></div>
<div class="bg-overlay"></div>

<div class="font-roboto" style="min-height: 100vh; width: 100%; display: flex; flex-direction: column;">
    <nav class="top-nav p-4" style="display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
        <div style="display: flex; gap: 10px;">
            <a href="{{ url_for('home.Rover_Home_Page') }}" class="button is-black is-outlined is-size-6" style="font-family: Roboto Mono">Home</a>
            <a href="{{ url_for('auth.Signup') }}" class="button is-black is-outlined is-size-6" style="font-family: Roboto Mono">Sign Up</a>
        </div>
        <div>
            <a href="{{ url_for('home.Contact') }}" class="button is-black is-outlined is-size-6" style="font-family: Roboto Mono">Contact Support</a>
        </div>
    </nav>

    <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 1rem;">
        <div class="box" style="width: 100%; max-width: 450px; background-color: var(--rover-surface); box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1); padding: 2rem;">
            <h1 class="title is-2 has-text-centered has-text-black mb-5">Login</h1>

            <form method="POST" action="{{ url_for('auth.Handle_Login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="field">
                    <label class="label has-text-black" for="username">Username</label>
                    <div class="control">
                        <input class="input" type="text" id="username" name="username" placeholder="********" required>
                    </div>
                </div>

                <div class="field mb-5">
                    <label class="label has-text-black" for="password">Password</label>
                    <div class="control">
                        <input class="input" type="password" id="password" name="password" placeholder="********" required>
                    </div>
                </div>

                <div class="has-text-centered">
                    <button type="submit" class="button is-black hover_designNow" style="padding: 0.75rem 3rem;">
                        Login
                    </button>
                </div>
            </form>

            <p class="has-text-centered mt-4 has-text-black">
                Don't have an account? <a href="{{ url_for('auth.Signup') }}" style="color: var(--rover-accent-hover); font-weight: bold;">Sign Up</a>
            </p>
            <p class="has-text-centered mt-3">
                <a href="{{ url_for('auth.Forgot_Password') }}" style="color: var(--rover-accent-hover); font-weight: bold;">Forgot password?</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
