<div class="control password-control">
    <input class="input" type="password" id="password" name="password" placeholder="********" autocomplete="{{ password_autocomplete }}" required>
    <button class="password-toggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false" title="Show password" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <path class="password-eye-slash" d="M4 4l16 16"></path>
        </svg>
    </button>
</div>
