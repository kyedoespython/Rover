{% extends "base.html" %}

{% block title %}
    <title>Rover Sign Up</title>
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bulma/bulma.min.css') }}">
{% endblock %}

{% block extra_js %}
    <script src="{{ url_for('static', filename='scripts/Signup.js') }}?v=1" defer></script>
{% endblock %}

{% block content %}

<style>
    .font-roboto, .font-roboto * {
        font-family: var(--rover-font-sans) !important;
    }

    .font-roboto {
        position: relative;
        z-index: 2;
    }

    .input, .select select {
        background-color: var(--rover-control-bg) !important;
        color: var(--rover-text) !important;
        border: 1px solid var(--rover-control-border) !important;
        box-shadow: none !important;
    }
    .input::placeholder {
        color: var(--rover-muted) !important;
        opacity: 1;
    }
    .input:focus, .select select:focus {
        border-color: var(--rover-accent) !important;
        box-shadow: 0 0 0 0.125em rgba(194, 203, 207, 0.2) !important;
    }

    .select:not(.is-multiple):not(.is-loading)::after {
        border-color: var(--rover-accent) !important;
    }

    .hover_designNow {
        transition: all 0.5s ease;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
    }
    .hover_designNow:hover {
        background-color: var(--rover-accent-strong-hover) !important;
        color: var(--rover-text) !important;
    }
</style>

<div class="font-roboto" style="min-height: 100vh; min-height: 100dvh; width: 100%; display: flex; flex-direction: column;">
    
    <!-- Navigation -->
    <nav class="top-nav p-4" style="display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
        <div style="display: flex; gap: 10px;">
            <a href="{{ url_for('home.Rover_Home_Page') }}" class="button is-black is-outlined is-size-6">Home</a>
            <a href="{{ url_for('auth.Login') }}" class="button is-black is-outlined is-size-6">Login</a>
        </div>
        <div>
            <a href="{{ url_for('home.Contact') }}" class="button is-black is-outlined is-size-6">Contact Support</a>
        </div>
    </nav>

    <!-- Signup Form Section -->
    <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 1rem;">
        
        <!-- The Form Card -->
        <div class="box" style="width: 100%; max-width: 450px; background-color: var(--rover-surface); box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1); padding: clamp(1.25rem, 4vw, 2rem);">
            
            <h1 class="title is-2 has-text-centered has-text-black mb-5">Sign Up</h1>

            <form action="{{ url_for('auth.Handle_Signup') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="field">
                    <label class="label has-text-black">Email</label>
                    <div class="control">
                        <input class="input" type="email" id="email" name="email" placeholder="********" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label has-text-black">Username</label>
                    <div class="control">
                        <input class="input" type="text" id="username" name="username" placeholder="********" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label has-text-black">Password</label>
                    <div class="control">
                        <input class="input" type="password" id="password" name="password" placeholder="********" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label has-text-black">Phone Number <span class="has-text-grey-light">(Optional)</span></label>
                    <div class="control">
                        <input class="input" type="tel" id="telephone" name="telephone" placeholder="********">
                    </div>
                </div>

                <div class="field mb-5">
                    <label class="label has-text-black">Country</label>
                    <div class="control">
                        <div class="select is-fullwidth">
                            <select id="signupCountry" name="country" required>
                                <option value="">Select a country</option>
                                <option value="United Kingdom" data-calling-code="44">United Kingdom +44</option>
                                <option value="United States" data-calling-code="1">United States +1</option>
                                <option value="Germany" data-calling-code="49">Germany +49</option>
                                <option value="France" data-calling-code="33">France +33</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="has-text-centered">
                    <button type="submit" class="button is-black hover_designNow" style="padding: 0.75rem 3rem;">
                        Sign Up
                    </button>
                </div>
            </form>

            <p class="has-text-centered mt-4 has-text-black">
                Already have an account? <a href="{{ url_for('auth.Login') }}" style="color: var(--rover-accent-hover); font-weight: bold;">Login</a>
            </p>
        </div>
        
    </div>
</div>

{% endblock %}
