{% extends "base.html" %}

{% block title %}<title>Rover Home</title>{% endblock %}

{% block extra_js %}
    <script type="module" src="{{ url_for('static', filename='react/app.js') }}"></script>
{% endblock %}

{% block content %}
<div
    id="react-root"
    data-page="home"
    data-props="{{ {'loggedIn': current_user.is_authenticated, 'username': current_user.username if current_user.is_authenticated else '', 'logoUrl': url_for('static', filename='images/Rover_Logo.png')}|tojson|forceescape }}"
></div>
{% endblock %}
