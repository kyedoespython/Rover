{% extends "base.html" %}

{% block title %}
    <title>Reset Password | Rover</title>
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bulma/bulma.min.css') }}">
{% endblock %}

{% block content %}
<div class="container is-flex is-justify-content-center is-align-items-center" style="min-height: 100vh; padding: 1rem;">
    <section class="box" style="width: 100%; max-width: 450px;">
        <h1 class="title is-3 has-text-centered">Reset password</h1>
        <p class="mb-5">Choose a new password with at least 8 characters, one uppercase letter, and one special character (!@#$%^&amp;*).</p>
        <form method="post" action="{{ url_for('auth.Reset_Password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="token" value="{{ token }}">
            <div class="field">
                <label class="label" for="newPassword">New password</label>
                <div class="control">
                    <input class="input" type="password" id="newPassword" name="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                </div>
            </div>
            <div class="field mb-5">
                <label class="label" for="confirmPassword">Confirm new password</label>
                <div class="control">
                    <input class="input" type="password" id="confirmPassword" name="confirm_password" minlength="8" maxlength="128" autocomplete="new-password" required>
                </div>
            </div>
            <div class="has-text-centered">
                <button class="button is-black" type="submit">Reset password</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
