services:
  web:
    build:
      context: .
      provenance: mode=max
      sbom: true
    init: true
    expose:
      - "8000"
    volumes:
      - note_files:/var/lib/rover/notes
    environment:
      APP_ENV: production
      NOTE_STORAGE_DIR: /var/lib/rover/notes
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_API_KEY_ENCRYPTION_KEY: ${OLLAMA_API_KEY_ENCRYPTION_KEY:-}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the environment or .env file}
      DATABASE_URL: postgresql+psycopg://rover:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .env file}@db:5432/rover
      REDIS_URL: redis://redis:6379/0
      SESSION_TYPE: redis
      SESSION_PERMANENT: "false"
      SESSION_USE_SIGNER: "true"
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in the environment or .env file}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    command: sh -c "flask db upgrade && gunicorn -w 4 -b 0.0.0.0:8000 wsgi:app"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    environment:
      ROVER_DOMAIN: ${ROVER_DOMAIN:?Set ROVER_DOMAIN to the public hostname for Rover}
      NGINX_ENVSUBST_FILTER: "^ROVER_DOMAIN$"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - proxy_certs:/etc/nginx/certs
      - acme_webroot:/var/www/certbot
      - nginx_run:/run/nginx
    depends_on:
      - web

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    pid: "service:nginx"
    environment:
      ROVER_DOMAIN: ${ROVER_DOMAIN:?Set ROVER_DOMAIN to the public hostname for Rover}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL for certificate notifications}
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - proxy_certs:/etc/nginx/certs
      - acme_webroot:/var/www/certbot
      - nginx_run:/run/nginx
    depends_on:
      - nginx
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if certbot certonly --webroot --webroot-path /var/www/certbot \
            --email "$$CERTBOT_EMAIL" --agree-tos --non-interactive \
            --keep-until-expiring -d "$$ROVER_DOMAIN"; then
            if cp "/etc/letsencrypt/live/$$ROVER_DOMAIN/fullchain.pem" /etc/nginx/certs/fullchain.pem \
              && cp "/etc/letsencrypt/live/$$ROVER_DOMAIN/privkey.pem" /etc/nginx/certs/privkey.pem \
              && kill -HUP "$$(cat /run/nginx/nginx.pid)"; then
              echo "Nginx loaded the certificate for $$ROVER_DOMAIN."
            else
              echo "Failed to install or reload the certificate for $$ROVER_DOMAIN." >&2
              exit 1
            fi
            sleep 12h
          else
            sleep 5m
          fi
        done

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rover
      POSTGRES_USER: rover
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rover -d rover"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  note_files:
  letsencrypt_data:
  proxy_certs:
  acme_webroot:
  nginx_run:
