{% extends "base.html" %}

{% block title %}<title>Reset Password | Rover</title>{% endblock %}
{% block extra_js %}
    <script type="module" src="{{ url_for('static', filename='react/app.js') }}"></script>
{% endblock %}
{% block content %}
<div
    id="react-root"
    data-page="reset-password"
    data-csrf-token="{{ csrf_token() }}"
    data-props="{{ {'token': token}|tojson|forceescape }}"
></div>
{% endblock %}
