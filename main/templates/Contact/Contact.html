{% extends "base.html" %}

{% block title %}<title>Rover Contact</title>{% endblock %}
{% block extra_js %}
    <script type="module" src="{{ url_for('static', filename='react/app.js') }}"></script>
{% endblock %}
{% block content %}
<div
    id="react-root"
    data-page="support"
    data-csrf-token="{{ csrf_token() }}"
    data-props="{{ {
        'authenticated': current_user.is_authenticated,
        'ticketContent': request.form.get('TicketContent', ''),
        'ticketName': request.form.get('ticketName', ''),
        'ticketType': request.form.get('ticketType', '')
    }|tojson|forceescape }}"
></div>
{% endblock %}
